name: despertar eros

# Render duerme los servicios gratis a los 15 minutos sin visitas.
# Este ping cada 10 minutos los mantiene despiertos (en repo publico los minutos son gratis).
# Si la URL del servicio te quedo con un sufijo (https://eros-ai-ab12.onrender.com),
# cambiala SOLO en la linea de abajo.

env:
  URL: https://eros-ai.onrender.com/api/estado

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: tocar la web
        run: |
          for intento in 1 2 3; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" -m 120 "$URL" || true)
            echo "intento $intento -> $codigo"
            if [ "$codigo" = "200" ]; then exit 0; fi
            sleep 25
          done
          echo "sin respuesta 200: revisa la URL del servicio en el workflow"
          exit 0
