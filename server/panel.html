<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Eros</title>
<style>
  :root{ --bg:#0b0b0c; --fg:#f2f2f3; --fg2:#9b9ba1; --line:#232326; --soft:#141416;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);padding:26px 18px 70px}
  .col{max-width:940px;margin:0 auto}
  h1{font-size:19px;margin:0 0 4px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg2);margin:26px 0 8px;font-weight:600}
  .nota{color:var(--fg2);font-size:12px}
  a{color:var(--fg)}
  .tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:18px}
  .t{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--soft)}
  .t .k{font-size:11px;color:var(--fg2);text-transform:uppercase;letter-spacing:.08em}
  .t .v{font-size:22px;font-weight:600;margin-top:4px}
  table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
  tr:last-child td{border-bottom:0}
  th{background:var(--soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2)}
  .mono{font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<div class="col">
  <h1>Panel de uso · Eros</h1>
  <div class="nota">Se refresca solo cada 10 s · <a href="/">volver al chat</a> · <a href="/api/uso" target="_blank">json</a> · <a href="/logout">salir</a></div>

  <div class="tarjetas" id="tarjetas"></div>

  <h2>consumo por alumno (hoy)</h2>
  <table><thead><tr><th>alumno</th><th>mensajes</th><th>tokens</th><th>costo</th><th>primera</th><th>última</th></tr></thead>
  <tbody id="alumnos"></tbody></table>

  <h2>últimas peticiones</h2>
  <table><thead><tr><th>hora</th><th>alumno</th><th>entrada</th><th>salida</th><th>costo</th></tr></thead><tbody id="ultimas"></tbody></table>

  <h2>notas</h2>
  <div class="nota" id="notas"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const num = n => (n || 0).toLocaleString('es');
async function pintar(){
  let d;
  try { d = await (await fetch('/api/uso')).json(); } catch(e){ $('#notas').textContent = 'sin conexión con el gateway'; return; }
  $('#tarjetas').innerHTML = [
    ['mensajes hoy', num(d.total_mensajes)],
    ['tokens hoy', num(d.total_tokens)],
    ['costo hoy', 'US$ ' + (d.costo_total || 0).toFixed(4)],
    ['alumnos activos', Object.keys(d.alumnos || {}).length],
    ['modelo', d.modelo || '-']
  ].map(([k,v]) => '<div class="t"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>').join('');
  $('#alumnos').innerHTML = (d.alumnos && d.alumnos.length)
    ? d.alumnos.map(a => '<tr><td>'+a.nombre+'</td><td>'+num(a.mensajes)+'</td><td class="mono">'+num(a.tokens)+'</td><td class="mono">US$ '+(a.costo||0).toFixed(4)+'</td><td class="mono">'+(a.primera||'-')+'</td><td class="mono">'+(a.ultima||'-')+'</td></tr>').join('')
    : '<tr><td colspan="6">todavía nadie usó Eros hoy</td></tr>';
  $('#ultimas').innerHTML = (d.ultimas && d.ultimas.length)
    ? d.ultimas.map(u => '<tr><td class="mono">'+u.hora+'</td><td>'+u.alumno+'</td><td class="mono">'+num(u.entrada)+'</td><td class="mono">'+num(u.salida)+'</td><td class="mono">US$ '+(u.costo||0).toFixed(5)+'</td></tr>').join('')
    : '<tr><td colspan="5">sin registros</td></tr>';
  $('#notas').innerHTML = 'Día contabilizado: ' + d.fecha + '. Los límites por alumno y el modelo activo se cambian en <span class="mono">.env</span> y se aplican al reiniciar la web. La API key nunca se muestra: vive solo en el servidor.';
}
pintar(); setInterval(pintar, 10000);
</script>
</body>
</html>
