<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Eros</title>
<link rel="icon" href="/static/eros.jpg">
<style>
  :root{ --bg:#0b0b0c; --fg:#f2f2f3; --fg2:#9b9ba1; --line:#232326; --soft:#141416;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--sans);display:grid;place-items:center;padding:24px}
  .caja{width:100%;max-width:410px;border:1px solid var(--line);border-radius:18px;padding:26px;background:var(--soft)}
  .logo{width:clamp(76px,28vw,104px);height:clamp(76px,28vw,104px);border-radius:50%;object-fit:contain;border:1px solid var(--line);
    display:block;margin:0 auto 14px;background:#000}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em;text-align:center}
  p.sub{color:var(--fg2);font-size:13.5px;margin:0 0 22px;text-align:center}
  label{display:block;font-size:12px;color:var(--fg2);margin:14px 0 6px}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);outline:none;font:inherit}
  input:focus{border-color:var(--fg)}
  input#codigo{letter-spacing:.12em}
  .campo{position:relative}
  .campo input{padding-right:64px}
  #verCodigo{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg2);font:12px var(--sans);cursor:pointer}
  #verCodigo:hover{color:var(--fg);border-color:var(--fg)}
  button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:var(--fg);color:var(--bg);
    font:inherit;font-weight:600;cursor:pointer}
  button:hover{opacity:.9}
  .malo{border:1px solid var(--line);border-left:3px solid #ff5f5f;border-radius:10px;padding:9px 12px;font-size:13px;
    color:var(--fg2);margin-bottom:6px;display:none}
  .pie{color:var(--fg2);font-size:11.5px;margin-top:16px;text-align:center}
</style>
</head>
<body>
  <form class="caja" method="post" action="/login">
    <img class="logo" src="/static/eros.jpg" alt="Eros">
    <h1>Eros</h1>
    <p class="sub">Escribe tu nombre o alias y el clave de invitación que te dio el profe.</p>
    <div class="malo" id="malo"></div>
    <label for="nombre">Tu nombre o alias</label>
    <input id="nombre" name="nombre" placeholder="ej: ana" autocomplete="username" autofocus required>
    <label for="codigo">Clave de invitación</label>
    <div class="campo">
      <input id="codigo" name="codigo" type="password" placeholder="tu llave o tu clave" autocomplete="current-password" required>
      <button type="button" id="verCodigo">ver</button>
    </div>
    <button type="submit">Entrar</button>
    <div class="pie">Si el alias está libre, queda registrado a tu nombre. El profe entra con su clave maestra.</div>
  </form>
<script>
  const mensajes = {
    llave: 'Ese código no existe o ya fue usado. Pídele uno nuevo al profe.',
    tomado: 'Ese alias ya está tomado. Usa otro o entra con el código de ese alias.',
    otrollave: 'Ese alias existe y el código es de otra persona. Pide tu llave al profe, o entra con tu clave maestra si sos el admin.',
    falta: 'Completa los dos campos.',
    '1': 'Nombre o código incorrecto.'
  };
  const vc = document.querySelector('#verCodigo'), campo = document.querySelector('#codigo');
  vc.onclick = () => { const oculto = campo.type === 'password'; campo.type = oculto ? 'text' : 'password'; vc.textContent = oculto ? 'ocultar' : 'ver'; campo.focus(); };
  const e = new URLSearchParams(location.search).get('error');
  if (e) { const m = document.querySelector('#malo'); m.textContent = mensajes[e] || mensajes['1']; m.style.display = 'block'; }
</script>
</body>
</html>
