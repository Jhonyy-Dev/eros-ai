<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Eros</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f2f2f3'/><text x='16' y='22' font-size='18' font-family='sans-serif' text-anchor='middle' fill='%230b0b0c'>E</text></svg>">
<style>
  :root{ --bg:#0b0b0c; --fg:#f2f2f3; --fg2:#9b9ba1; --line:#232326; --soft:#141416;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--sans);display:grid;place-items:center;padding:24px}
  .caja{width:100%;max-width:400px;border:1px solid var(--line);border-radius:18px;padding:26px;background:var(--soft)}
  .logo{width:44px;height:44px;border-radius:13px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:21px;margin-bottom:16px}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  p.sub{color:var(--fg2);font-size:13.5px;margin:0 0 22px}
  label{display:block;font-size:12px;color:var(--fg2);margin:14px 0 6px}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);outline:none;font:inherit}
  input:focus{border-color:var(--fg)}
  button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:var(--fg);color:var(--bg);
    font:inherit;font-weight:600;cursor:pointer}
  button:hover{opacity:.9}
  .malo{border:1px solid var(--line);border-left:3px solid #ff5f5f;border-radius:10px;padding:9px 12px;font-size:13px;
    color:var(--fg2);margin-bottom:6px;display:none}
  .pie{color:var(--fg2);font-size:11.5px;margin-top:16px;text-align:center}
</style>
</head>
<body>
  <form class="caja" method="post" action="/login">
    <div class="logo">E</div>
    <h1>Eros</h1>
    <p class="sub">Entra con tu nombre y el código que te dio el profe.</p>
    <div class="malo" id="malo">Nombre o código incorrecto. Fíjate en mayúsculas y vuelve a intentar.</div>
    <label for="nombre">Tu nombre</label>
    <input id="nombre" name="nombre" placeholder="ej: ana" autocomplete="username" autofocus required>
    <label for="codigo">Código de invitación</label>
    <input id="codigo" name="codigo" placeholder="ej: clase2026" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div class="pie">Asistente del curso · sin filtros · responde con datos</div>
  </form>
<script>
  if (new URLSearchParams(location.search).get('error')) document.querySelector('#malo').style.display = 'block';
</script>
</body>
</html>
